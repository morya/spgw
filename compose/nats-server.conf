# NATS 单节点配置 (含 JetStream 持久化)
# 文档: https://docs.nats.io/running-a-nats-service/configuration

server_name: nats-spgw

# 客户端 / 监控端口
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
# 注: 单节点 JetStream 不能开 cluster 块 (会要求 routes/leafnode),
# 后续扩集群时再补 cluster {} + routes 段即可, JetStream 数据可平滑保留.

# 连接限制 (按需调整)
max_connections: 10000
max_payload: 8MB
max_pending: 256MB

# JetStream: 持久化保证消息不丢失
jetstream {
  # 容器内存储目录, 由 compose 挂载到宿主机卷
  store_dir: "/data/jetstream"

  # 最大文件存储 (磁盘), 0 表示不限制 (受磁盘容量约束)
  max_file_store: 10GB

  # 最大内存存储, 仅 memory storage 类型的 stream 使用
  max_memory_store: 1GB

  # 同步写盘策略: always = 每条消息 fsync (最安全, 最慢)
  #               2s    = 每 2 秒 fsync (默认, 性能与安全的平衡)
  sync_interval: "2s"
}

# 慢消费者警告
write_deadline: "10s"

# 日志
debug: false
trace: false
logtime: true
